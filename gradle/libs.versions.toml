# Alla versioner på ett ställe. Val och motivering: ARKITEKTUR.md → "Byggkonfiguration"
# och "Verifierade API:er". Katalogen har med avsikt även bibliotek som tas i bruk i senare
# issues (Firestore/DataStore #15, inloggning #16, typsnitt och Turbine #20), så att
# versionerna valts och verifierats tillsammans.

[versions]
agp                      = "9.5.2"
kotlin                   = "2.4.21"
ksp                      = "2.3.14"
composeBom               = "2026.11.01"
material3                = "1.5.0"
navigation3              = "1.2.2"
lifecycle                = "2.11.1"
activityCompose          = "1.13.0"
coreKtx                  = "1.19.1"
hilt                     = "2.60.1"
hiltLifecycle            = "1.4.0"
firebaseBom              = "35.2.0"
credentials              = "1.6.0"
googleid                 = "1.2.1"
datastore                = "1.3.0"
work                     = "2.12.0"
googleServices           = "4.6.0"
kotlinxSerialization     = "1.13.0"
kotlinxDatetime          = "0.8.0"
kotlinxCoroutines        = "1.11.0"
kotlinxCollections       = "0.5.2"
junit                    = "4.13.2"
robolectric              = "4.18.1"
roborazzi                = "1.79.0"
konsist                  = "0.18.1"
turbine                  = "1.2.1"
androidxTestRunner       = "1.7.0"
androidxTestExtJunit     = "1.3.0"
concurrentFutures        = "1.3.0"
errorProneAnnotations    = "2.53.0"
pmd                      = "7.29.0"
spotless                 = "8.11.0"
ktlint                   = "1.8.0"
composeRules             = "0.6.8"
androidUi                = "3.11.0"   # komponentbiblioteket (github.com/Kodhast/android-ui)

[libraries]
androidx-core-ktx                     = { group = "androidx.core",               name = "core-ktx",                          version.ref = "coreKtx" }
