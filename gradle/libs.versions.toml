android-ui-testing                    = { group = "se.kodhast.ui",              name = "ui-testing",                        version.ref = "androidUi" }
# Test
junit                                 = { group = "junit",                       name = "junit",                             version.ref = "junit" }
kotlin-test                           = { group = "org.jetbrains.kotlin",        name = "kotlin-test",                       version.ref = "kotlin" }
robolectric                           = { group = "org.robolectric",             name = "robolectric",                       version.ref = "robolectric" }
roborazzi                             = { group = "io.github.takahirom.roborazzi", name = "roborazzi",                       version.ref = "roborazzi" }
roborazzi-compose                     = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose",               version.ref = "roborazzi" }
roborazzi-junit-rule                  = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule",            version.ref = "roborazzi" }
androidx-test-runner                  = { group = "androidx.test",               name = "runner",                            version.ref = "androidxTestRunner" }
errorprone-annotations                = { group = "com.google.errorprone",       name = "error_prone_annotations",           version.ref = "errorProneAnnotations" }
androidx-concurrent-futures           = { group = "androidx.concurrent",         name = "concurrent-futures",                version.ref = "concurrentFutures" }
androidx-test-ext-junit               = { group = "androidx.test.ext",           name = "junit",                             version.ref = "androidxTestExtJunit" }
konsist                               = { group = "com.lemonappdev",             name = "konsist",                           version.ref = "konsist" }
turbine                               = { group = "app.cash.turbine",            name = "turbine",                           version.ref = "turbine" }
# Copy-paste-detektor (cpdCheck i rotens build.gradle.kts)
pmd-cli                               = { group = "net.sourceforge.pmd",         name = "pmd-cli",                           version.ref = "pmd" }
pmd-kotlin                            = { group = "net.sourceforge.pmd",         name = "pmd-kotlin",                        version.ref = "pmd" }
compose-rules-ktlint                  = { group = "io.nlopez.compose.rules",     name = "ktlint",                            version.ref = "composeRules" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }
roborazzi            = { id = "io.github.takahirom.roborazzi",             version.ref = "roborazzi" }
spotless             = { id = "com.diffplug.spotless",                     version.ref = "spotless" }
